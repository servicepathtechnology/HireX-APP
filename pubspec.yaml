name: hirex_app
description: HireX — Let Work Speak Louder Than Resumes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3

  # Social auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # HTTP
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # UI / UX
  lottie: ^3.1.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  crop_your_image: ^2.0.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Part 2 packages
  flutter_markdown: ^0.6.23
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  share_plus: ^10.0.0
  timeago: ^3.7.0

  # Part 3 packages
  razorpay_flutter: ^1.3.6
  flutter_rating_bar: ^4.0.1
  dotted_border: ^2.1.0
  badges: ^3.1.2
  data_table_2: ^2.5.12
  flutter_svg: ^2.0.10+1

  # Part 4 packages
  flutter_local_notifications: ^17.2.4
  web_socket_channel: ^3.0.1

  # Part 5 packages
  sentry_flutter: ^9.16.1
  mixpanel_flutter: ^2.3.3
  flutter_branch_sdk: ^9.3.0
  app_tracking_transparency: 2.0.6+1
  in_app_review: ^2.0.9

  # Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/
    - .env
